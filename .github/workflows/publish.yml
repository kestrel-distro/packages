name: publish

# Builds Kestrel's own packages from their forks, signs them, assembles the
# pacman repository database, and publishes the whole repository to GitHub Pages
# (served at https://kestrel-distro.github.io/packages/).
#
# Required repository secrets:
#   KESTREL_GPG_PRIVATE_KEY  armored export of the (passphrase-less) signing key
#   KESTREL_GPG_KEY_ID       the signing key id/fingerprint
#
# The key must be a dedicated Kestrel packaging key, not a personal key.

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: Also rebuild kernel-kestrel (~4 h). Uncheck for a fast desktop-only publish.
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [upstream-release, desktop-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    env:
      GPG_KEY: ${{ secrets.KESTREL_GPG_KEY_ID }}
    steps:
      - name: Prepare build environment
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retrying: $*"; sleep 15; done; return 1; }
          retry pacman -Sy --noconfirm --needed archlinux-keyring
          retry pacman -Su --noconfirm --needed base-devel git sudo gnupg
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          printf 'GPGKEY=%s\n' "$GPG_KEY" >> /home/builder/.makepkg.conf

      - name: Import signing key
        env:
          KESTREL_GPG_PRIVATE_KEY: ${{ secrets.KESTREL_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$KESTREL_GPG_PRIVATE_KEY" ]]; then
            echo "KESTREL_GPG_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          keyfile="$(mktemp)"
          chmod 600 "$keyfile"
          printf '%s\n' "$KESTREL_GPG_PRIVATE_KEY" >"$keyfile"
          install -o builder -g builder -m600 "$keyfile" /home/builder/signing.asc
          sudo -u builder gpg --batch --import /home/builder/signing.asc
          shred -u "$keyfile" /home/builder/signing.asc

      - name: Restore existing repository
        # Pages only ever holds the latest successful publish. Merge prior
        # packages into /repo so a desktop-only run (build_kernel=false) does
        # not drop kernel-kestrel from the served repository.
        run: |
          mkdir -p /repo && chown builder /repo
          base="https://kestrel-distro.github.io/packages"
          db="$(mktemp)"
          if curl -fsSL "$base/kestrel.db" -o "$db"; then
            mapfile -t files < <(tar -xOf "$db" --wildcards '*/desc' 2>/dev/null \
              | awk '/^%FILENAME%$/{getline; print}')
            # A db that downloads but parses to zero packages means the repo
            # would be rebuilt from only this run's output, silently dropping
            # everything previously published. Fail loudly instead.
            if (( ${#files[@]} == 0 )); then
              echo "kestrel.db downloaded but contains no packages; refusing to continue" >&2
              exit 1
            fi
            echo "restoring ${#files[@]} existing package(s) from Pages"
            for f in "${files[@]}"; do
              curl -fsSL "$base/$f" -o "/repo/$f" || { echo "failed to fetch $f" >&2; exit 1; }
              curl -fsSL "$base/$f.sig" -o "/repo/$f.sig" \
                || { echo "failed to fetch $f.sig" >&2; exit 1; }
            done
          else
            echo "no existing repository on Pages yet; starting fresh"
          fi
          rm -f "$db"
          chown builder:builder /repo

      - name: Build packages
        run: |
          build_pkg() {
            local name="$1" url="$2" sub="$3"; shift 3
            echo "::group::build $name"
            rm -rf /tmp/src
            git clone --quiet "$url" /tmp/src
            chown -R builder:builder /tmp/src
            ( cd "/tmp/src/$sub" && \
              sudo -u builder env -u CI -u GITHUB_RUN_ID -u GITHUB_ACTIONS \
                PKGDEST=/repo makepkg -f --sign --noconfirm --nocheck "$@" )
            rm -rf /tmp/src
            echo "::endgroup::"
          }
          build_pkg hyprland   https://github.com/kestrel-distro/hyprland   packaging/local -s
          build_pkg quickshell https://github.com/kestrel-distro/quickshell packaging/local -s

          # Desktop library closure, rebuilt from upstream at Arch's versions with
          # clang -march=x86-64-v3 + ThinLTO (distinct -kestrel names).
          for lib in hyprutils hyprlang hyprgraphics hyprcursor hyprwire aquamarine; do
            build_pkg "$lib-kestrel" https://github.com/kestrel-distro/desktop "packaging/$lib" -s
          done

          # Metapackage: no build-time dependencies; its depends resolve from
          # [kestrel] at install time, so skip the dependency check (no -s).
          build_pkg kestrel-desktop https://github.com/kestrel-distro/desktop packaging/kestrel-desktop --nodeps

          # qtbase carries the Wayland client (Quickshell presents through
          # it); the kestrel-distro/qtbase fork adds client-side explicit
          # sync. Longest desktop build after the two main packages.
          build_pkg qt6-base-kestrel https://github.com/kestrel-distro/desktop packaging/qt6-base -s

          # Kernel-bridge packages: the scheduling hint library, the broker
          # that drives class placement, and the scx_kestrel scheduler. The
          # broker and lib need no build deps (--nodeps); scx_kestrel is a
          # cargo workspace crate.
          build_pkg libkestrel-hint https://github.com/kestrel-distro/kestrel packaging/libkestrel-hint --nodeps
          build_pkg kestrel-broker https://github.com/kestrel-distro/kestrel packaging/kestrel-broker --nodeps
          build_pkg scx-kestrel https://github.com/kestrel-distro/scx packaging/arch -s

          # Kernel last: it is by far the longest build. Skipped for
          # desktop-release dispatches (a push to a desktop repo only changes
          # the desktop set) and when build_kernel=false; the restored
          # packages above keep the served repo intact either way.
          skip_kernel=0
          [[ "${{ github.event.action }}" == "desktop-release" ]] && skip_kernel=1
          [[ "${{ inputs.build_kernel }}" == "false" ]] && skip_kernel=1
          if (( ! skip_kernel )); then
            build_pkg kernel https://github.com/kestrel-distro/kernel packaging/local -s
          else
            echo "skipping kernel build; keeping existing kernel packages"
          fi

      - name: Assemble the repository
        run: |
          cd /repo
          # Run as builder so repo-add signs the database with the key in the
          # builder keyring (the key was imported there, not for root).
          sudo -u builder repo-add --sign --key "$GPG_KEY" kestrel.db.tar.gz ./*.pkg.tar.zst
          pages="$GITHUB_WORKSPACE/pages"
          rm -rf "$pages" && mkdir -p "$pages"
          cp ./*.pkg.tar.zst ./*.pkg.tar.zst.sig "$pages/"
          # pacman fetches <repo>.db and <repo>.db.sig; repo-add names them
          # kestrel.db.tar.gz and kestrel.db.tar.gz.sig.
          cp kestrel.db.tar.gz "$pages/kestrel.db"
          cp kestrel.db.tar.gz.sig "$pages/kestrel.db.sig"
          ls -la "$pages"

      - name: Record tracked Arch dependency versions
        run: |
          pages="$GITHUB_WORKSPACE/pages"
          pkgs=(aquamarine hyprutils hyprlang hyprcursor hyprgraphics hyprland-guiutils
                qt6-base qt6-declarative qt6-wayland qt6-svg pipewire jemalloc cpptrace)
          {
            echo "# Arch package versions this build was compiled against."
            echo "# Regenerated on every publish. This is a record for humans and"
            echo "# drift forensics; automatic rebuilds trigger via the desktop"
            echo "# repo's version-check and repository_dispatch, not by diffing this file."
            for p in "${pkgs[@]}"; do
              v="$(pacman -Si "$p" 2>/dev/null | awk -F': ' '/^Version/{print $2; exit}')"
              printf '%s=%s\n' "$p" "${v:-unknown}"
            done
          } >"$pages/deps.txt"
          cat "$pages/deps.txt"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
